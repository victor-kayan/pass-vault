[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pass-vault"
version = "0.1.0"
description = "Gerenciador de senhas local para fins educacionais"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "cryptography>=43,<47",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1", "mypy>=1.13,<2", "pylint>=3,<5"]

[project.scripts]
pv = "password_manager.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true

